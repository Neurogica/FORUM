[project]
name = "forum"
version = "1.0.0"
description = "FORUM: Frozen Outputs Reconciled Using Model Agreement for Visual Grounding (ACCV 2026)"
authors = [
    { name = "Taiyo Sato" },
    { name = "Takamasa Sanda" },
    { name = "Keisuke Maeda" },
    { name = "Takahiro Ogawa" },
    { name = "Miki Haseyama" },
    { name = "Shunya Nagashima", email = "shunya.nagashima@neurogica.com" },
]
keywords = ["visual-grounding", "referring-expression-comprehension", "multimodal-llm", "test-time-fusion", "ensemble"]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/Neurogica/FORUM"

[project.optional-dependencies]
inference = [
    "accelerate>=0.30",
    "requests>=2.31",
    "torch>=2.3",
    "transformers>=4.51",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
# GHSA-82r6-8w77-94w6: use IDNA 2008 for TLS hostname verification.
# GHSA-6q48-6c7w-9gw2: distrust the compromised emSign certificate chain.
constraint-dependencies = ["anyio>=4.14.2", "certifi>=2026.10.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forum"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
