[project]
name = "forum"
version = "1.0.0"
description = "FORUM: Frozen Outputs Reconciled via Uncorrelated Model Errors for Visual Grounding"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
inference = [
    "accelerate>=0.30",
    "requests>=2.31",
    "torch>=2.3",
    "transformers>=4.51",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forum"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
